#@method: mp
#@description: [cat: admin] Универсальный пакетный менеджер (apt/dnf/pacman) с картой опций и персистентностью
#@example: me mp ; me mp -i mpv ; me mp -s ffmpeg ; me mp -pm
#@variants:
#   me mp -pm     # Показать/сбросить текущий пакетный менеджер (me mp -pm reset)
#   me mp -l      # Установленные пакеты ; me mp -l <имя> — наличие конкретного
#   me mp -lu     # Список пакетов, доступных к обновлению
#   me mp -s x    # Поиск пакетов по запросу x
#   me mp -S x    # Информация о пакете x
#   me mp -i x    # Установить пакет x
#   me mp -r x    # Переустановить пакет x
#   me mp -d x    # Удалить пакет x
#   me mp -a      # Удалить неиспользуемые пакеты (autoremove)
#   me mp -u      # Обновить список доступных пакетов
#   me mp -U      # Обновить установленные пакеты
#   me mp -UD     # Полное обновление (dist-upgrade)
#   me mp -es     # Редактировать источники/репозитории
#   me mp -ms     # Конвертация .list → .sources (только apt)
#   me mp -sat x  # Удовлетворить строки зависимостей (только apt)
#@script: me_lib/mp.sh


