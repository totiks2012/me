#!/usr/bin/env bash
# Конфигурационный реестр методов для универсального пульта 'me'
# Логика и описание команд вынесены из тела основного бинарника.

#@method: play
#@description: [cat: media] Воспроизведение медиа-потока в активном плеере (playerctl)
#@example: me play
#@script: me_lib/play.sh


#@method: pause
#@description: [cat: media] Приостановка воспроизведения медиа-потока (playerctl)
#@example: me pause
#@script: me_lib/pause.sh


#@method: next
#@description: [cat: media] Переключение на следующий трек или видео (playerctl)
#@example: me next
#@script: me_lib/next.sh


#@method: prev
#@description: [cat: media] Переключение на предыдущий трек или видео (playerctl)
#@example: me prev
#@script: me_lib/prev.sh


#@method: stop
#@description: [cat: media] Полная остановка воспроизведения медиа (playerctl)
#@example: me stop
#@script: me_lib/stop.sh


#@method: toggle
#@description: [cat: media] Переключение воспроизведение / пауза (playerctl)
#@example: me toggle
#@script: me_lib/toggle.sh


#@method: say
#@description: [cat: notify] Вывод уведомления на экран: текст, заголовок, иконка, таймаут (notify-send)
#@example: me say "Готово" ; me say "Заголовок" "Текст" ; me say "Заголовок" "Текст" dialog-warning 5000
#@variants:
#   me say "текст"      # Уведомление (заголовок «Системное уведомление», 3 сек)
#   me say "Заголовок" "Текст"      # Уведомление с заголовком
#   me say "Заголовок" "Текст" dialog-warning 5000   # С иконкой и таймаутом 5 сек
#@script: me_lib/say.sh


#@method: vol
#@description: [cat: audio] Изменение уровня громкости аудиопотока [up|down|mute]
#@example: me vol up ; me vol down ; me vol mute
#@variants:
#   me vol up    # Увеличить громкость на 5%
#   me vol down  # Уменьшить громкость на 5%
#   me vol mute  # Переключить беззвучный режим
#@script: me_lib/vol.sh


#@method: bright
