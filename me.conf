    fi
}

#@method: del
#@description: [cat: admin] Удаление/восстановление методов me (в корзину)
#@example: me del
#@variants:
#   me del         # Меню: удалить или восстановить
#   me del -d      # Сразу режим удаления
#   me del -r      # Сразу режим восстановления
me_method_del() {
    local script_path="$HOME/.local/bin/me/me_lib/del.sh"
    if [ -x "$script_path" ]; then
        "$script_path" "$@"
    else
        notify-send -i dialog-error -t 3000 "Ошибка пульта" "del.sh не найден" 2>/dev/null || true
        echo "[me] Ошибка: Файл $script_path не найден или не имеет прав +x." >&2
        return 1
    fi
}

#@method: ytd
