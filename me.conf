#!/usr/bin/env bash
# Конфигурационный реестр методов для универсального пульта 'me'
# Логика и описание команд вынесены из тела основного бинарника.

#@method: play
#@description: Воспроизведение медиа-потока в активном плеере (playerctl)
#@example: me play
me_method_play() {
    playerctl play 2>/dev/null || true
}

#@method: pause
#@description: Приостановка воспроизведения медиа-потока (playerctl)
#@example: me pause
me_method_pause() {
    playerctl pause 2>/dev/null || true
}

#@method: next
#@description: Переключение на следующий трек или видео (playerctl)
#@example: me next
me_method_next() {
    playerctl next 2>/dev/null || true
}

#@method: prev
#@description: Переключение на предыдущий трек или видео (playerctl)
#@example: me prev
me_method_prev() {
    playerctl previous 2>/dev/null || true
}

#@method: stop
#@description: Полная остановка воспроизведения медиа (playerctl)
#@example: me stop
me_method_stop() {
    playerctl stop 2>/dev/null || true
}

#@method: toggle
#@description: Переключение воспроизведение / пауза (playerctl)
#@example: me toggle
me_method_toggle() {
    playerctl play-pause 2>/dev/null || true
}

#@method: say
#@description: Вывод быстрого или кастомного уведомления на экран через шлюз
#@example: me say "Привет" ; me say "Заголовок" "Текст" "dialog-warning" 3000
#@variants:
#   me say "текст"    # Показать уведомление
#   me say "Заголовок" "Текст"    # Уведомление с заголовком
me_method_say() {
    local title body icon timeout
    case "$#" in
        1) title="Системное уведомление"; body="$1"; icon=""; timeout=3000 ;;
        2) title="$1"; body="$2"; icon=""; timeout=3000 ;;
        3) title="$1"; body="$2"; icon="$3"; timeout=3000 ;;
        *) title="$1"; body="$2"; icon="$3"; timeout="${4:-3000}" ;;
    esac
    notify-send ${icon:+-i "$icon"} -t "$timeout" "$title" "$body" 2>/dev/null || true
}

#@method: vol
#@description: Изменение уровня громкости аудиопотока [up|down|mute]
#@example: me vol up ; me vol down ; me vol mute
#@variants:
#   me vol up    # Увеличить громкость на 5%
#   me vol down  # Уменьшить громкость на 5%
#   me vol mute  # Переключить беззвучный режим
me_method_vol() {
    case "$1" in
        up)   pactl set-sink-volume @DEFAULT_SINK@ +5% 2>/dev/null || amixer set Master 5%+ >/dev/null
              notify-send -i audio-volume-high -t 1500 "Звук" "Громкость увеличена" 2>/dev/null || true ;;
        down) pactl set-sink-volume @DEFAULT_SINK@ -5% 2>/dev/null || amixer set Master 5%- >/dev/null
              notify-send -i audio-volume-low -t 1500 "Звук" "Громкость уменьшена" 2>/dev/null || true ;;
        mute) pactl set-sink-mute @DEFAULT_SINK@ toggle 2>/dev/null || amixer set Master toggle >/dev/null
              notify-send -i audio-volume-muted -t 1500 "Звук" "Режим тишины переключен" 2>/dev/null || true ;;
        *)    echo "Используй: me vol [up|down|mute]" >&2 ;;
    esac
}

#@method: bright
#@description: Изменение уровня яркости экрана с верификацией через D-Bus интерфейсы
#@example: me bright up ; me bright down
#@variants:
#   me bright up    # Увеличить яркость
#   me bright down  # Уменьшить яркость
me_method_bright() {
    case "$1" in
        up)
            if busctl --user call org.xfce.PowerManager /org/xfce/PowerManager org.xfce.Power.Backlight IncreaseBrightness 2>/dev/null || \
               busctl --user call org.gnome.SettingsDaemon.Power /org/gnome/SettingsDaemon/Power org.gnome.SettingsDaemon.Power.Screen StepUp 2>/dev/null; then
                notify-send -i display-brightness -t 1500 "Экран" "Яркость увеличена" 2>/dev/null || true
                echo "Яркость увеличена"
            else
                notify-send -i dialog-error -t 2000 "Ошибка" "Менеджер питания D-Bus не отвечает" 2>/dev/null || true
                echo "[me] Ошибка: Окружение не поддерживает управление подсветкой." >&2
            fi
            ;;
        down)
            if busctl --user call org.xfce.PowerManager /org/xfce/PowerManager org.xfce.Power.Backlight DecreaseBrightness 2>/dev/null || \
               busctl --user call org.gnome.SettingsDaemon.Power /org/gnome/SettingsDaemon/Power org.gnome.SettingsDaemon.Power.Screen StepDown 2>/dev/null; then
                notify-send -i display-brightness -t 1500 "Экран" "Яркость уменьшена" 2>/dev/null || true
                echo "Яркость уменьшена"
            else
                notify-send -i dialog-error -t 2000 "Ошибка" "Менеджер питания D-Bus не отвечает" 2>/dev/null || true
                echo "[me] Ошибка: Окружение не поддерживает управление подсветкой." >&2
            fi
            ;;
        *)
            echo "Используй: me bright [up|down]" >&2
            return 1
            ;;
    esac
}

#@method: on
#@description: Запуск фонового пользовательского сервиса через systemd
#@example: me on dbus_tamer
me_method_on() {
    [ -z "$1" ] && { echo "Какой сервис запустить?" >&2; return 1; }
    systemctl --user start "$@"
}

#@method: off
#@description: Мгновенная остановка активного пользовательского сервиса systemd
#@example: me off dbus_tamer
me_method_off() {
    [ -z "$1" ] && { echo "Какой сервис остановить?" >&2; return 1; }
    systemctl --user stop "$@"
}

#@method: status
#@description: Мониторинг статуса конкретного сервиса или вывод всех активных
#@example: me status ; me status dbus_tamer
#@variants:
#   me status    # Список активных сервисов
#   me status dbus_tamer    # Статус конкретного сервиса
me_method_status() {
    if [ -z "$1" ]; then
        systemctl --user list-units --type=service --state=running
    else
        systemctl --user status "$@"
    fi
}

#@method: logout
#@description: Немедленный выход из текущей сессии пользователя через loginctl
#@example: me logout
me_method_logout() {
    notify-send -i system-log-out -t 3000 "Завершение сессии" "Выход пользователя $USER..." 2>/dev/null || true
    echo "Выход из сеанса..."
    sleep 0.5
    /usr/bin/loginctl terminate-user "$USER"
}

#@method: restart
#@description: Безопасная перезагрузка операционной системы через systemctl
#@example: me restart
me_method_restart() {
    notify-send -i system-reboot -t 3000 "Перезагрузка" "Система уходит на перезапуск..." 2>/dev/null || true
    echo "Перезагрузка..."
    sleep 0.5
    /usr/bin/systemctl reboot
}

#@method: offnow
#@description: Корректное и быстрое выключение рабочей станции через systemctl
#@example: me offnow
me_method_offnow() {
    notify-send -i system-shutdown -t 3000 "Выключение" "Завершение работы операционной системы..." 2>/dev/null || true
    echo "Выключение..."
    sleep 0.5
    /usr/bin/systemctl poweroff
}

#@method: stat
#@description: Срез состояния системы: температура CPU, громкость, батарея (если есть)
#@example: me stat
me_method_stat() {
    local vol cpu_temp bat_cap bat_stat out

    vol=$(pactl get-sink-volume @DEFAULT_SINK@ 2>/dev/null | awk '{print $5}' | head -n 1 || echo "N/A")
    cpu_temp=$(awk '{print $1/1000}' /sys/class/thermal/thermal_zone1/temp 2>/dev/null || echo "N/A")

    bat_cap=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null)
    bat_stat=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null)

    if [ -n "$bat_cap" ]; then
        out="Батарея: ${bat_cap}% (${bat_stat:-N/A}) | "
    else
        out=""
    fi
    echo "${out}Температура: ${cpu_temp}°C | Звук: ${vol}"
}

#@method: upgrade
#@description: Автономное тотальное обновление пакетов системы (поддержка pacman/apt/apk)
#@example: me upgrade
me_method_upgrade() {
    echo "=== Запуск тотального обновления ==="
    if command -v pacman &>/dev/null; then
        sudo pacman -Syu --noconfirm
    elif command -v apt-get &>/dev/null; then
        sudo apt-get update && sudo apt-get upgrade -y
    elif command -v apk &>/dev/null; then
        sudo apk update && sudo apk upgrade
    else
        echo "Неизвестный пакетный менеджер" >&2
        return 1
    fi
}


