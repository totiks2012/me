#@method: mov
#@description: [cat: files] Массовое переименование файлов по маске: замена символа, нумерация имени целиком ([]), якорь номера (#)
#@example: me mov -_ ; me mov "[]фото_1" ; me mov "копия_#"
#@variants:
#   me mov -_                  # Замена: во всех именах - на _
#   me mov "[]фото_1"          # Имя целиком: фото_1, фото_2 ... (старт из маски)
#   me mov "[]архив_001"       # Ширина счётчика: архив_001, архив_002 ...
#   me mov "файл_#_готово"     # Якорь #: файл_1_готово, файл_2_готово ...
#   me mov "img_##_fhd"        # Якорь ##: img_01_fhd, img_02_fhd ...
#@script: me_lib/mov.sh


