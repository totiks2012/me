#!/usr/bin/env bash
# Конфигурационный реестр методов для универсального пульта 'me'
# Логика и описание команд вынесены из тела основного бинарника.


#@method: share
#@description: Упаковка метода/всех методов со зависимостями в import/*.tar.gz
#@example: me share gifx ; me share -all
#@variants:
#   me share <method>     # Собрать пакет одного метода
#   me share -all         # Batch-пакет всех методов
#   me share -all all.tar.gz   # Batch-пакет с именем архива
me_method_share() {
    local script_path="$HOME/.local/bin/me/me_lib/share.sh"
    if [ -x "$script_path" ]; then
        "$script_path" share "$@"
    else
        echo "[me] Ошибка: share.sh не найден" >&2
        return 1
    fi
}
#@method: import
#@description: Импорт методов из файла/URL/архива в me.conf
#@example: me import ./method.block ; me import -all
#@variants:
#   me import <method|file|url>   # Импорт одного метода
#   me import -all [-f] [архив]   # Batch-импорт (архив опционален: me_all.tar.gz)
#   me import -diff [архив]       # Dry-run сравнение конфликтов
me_method_import() {
    local script_path="$HOME/.local/bin/me/me_lib/share.sh"
    if [ -x "$script_path" ]; then
        "$script_path" import "$@"
    else
        echo "[me] Ошибка: share.sh не найден" >&2
        return 1
    fi
}

#@method: bright
#@description: Изменение уровня яркости экрана с верификацией через D-Bus интерфейсы
#@example: me bright up ; me bright down
#@variants:
#   me bright up    # Увеличить яркость
#   me bright down  # Уменьшить яркость
me_method_bright() {
    case "$1" in
        up)
            if busctl --user call org.xfce.PowerManager /org/xfce/PowerManager org.xfce.Power.Backlight IncreaseBrightness 2>/dev/null || \
               busctl --user call org.gnome.SettingsDaemon.Power /org/gnome/SettingsDaemon/Power org.gnome.SettingsDaemon.Power.Screen StepUp 2>/dev/null; then
                notify-send -i display-brightness -t 1500 "Экран" "Яркость увеличена" 2>/dev/null || true
                echo "Яркость увеличена"
            else
                notify-send -i dialog-error -t 2000 "Ошибка" "Менеджер питания D-Bus не отвечает" 2>/dev/null || true
                echo "[me] Ошибка: Окружение не поддерживает управление подсветкой." >&2
            fi
            ;;
        down)
            if busctl --user call org.xfce.PowerManager /org/xfce/PowerManager org.xfce.Power.Backlight DecreaseBrightness 2>/dev/null || \
               busctl --user call org.gnome.SettingsDaemon.Power /org/gnome/SettingsDaemon/Power org.gnome.SettingsDaemon.Power.Screen StepDown 2>/dev/null; then
                notify-send -i display-brightness -t 1500 "Экран" "Яркость уменьшена" 2>/dev/null || true
                echo "Яркость уменьшена"
            else
                notify-send -i dialog-error -t 2000 "Ошибка" "Менеджер питания D-Bus не отвечает" 2>/dev/null || true
                echo "[me] Ошибка: Окружение не поддерживает управление подсветкой." >&2
            fi
            ;;
        *)
            echo "Используй: me bright [up|down]" >&2
            return 1
            ;;
    esac
}

