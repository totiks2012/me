#@method: run
#@description: Поиск и запуск скрипта по имени в ~/.local/bin/
#@example: me run pam4.sh ; me run cy
me_method_run() {
    local name="$1"
    shift
    local script
    script=$(find $HOME/.local/bin -maxdepth 3 -type f -executable -name "$name" 2>/dev/null | head -1)
    if [ -n "$script" ] && [ -x "$script" ]; then
        "$script" "$@"
    else
        echo "[me] Скрипт '$name' не найден в ~/.local/bin/" >&2
        return 1
    fi
}

