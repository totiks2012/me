#@method: logo
#@description: Включение/выключение логотипа \me/ перед каждым методом
#@example: me logo on ; me logo off
#@variants:
#   me logo on     # Включить логотип
#   me logo off    # Выключить логотип
me_method_logo() {
    local flag_file="$HOME/.config/me/.logo"
    case "${1:-}" in
        on|1|yes|true)
            echo "1" > "$flag_file"
            echo "\me/ Включён" ;;
        off|0|no|false)
            echo "0" > "$flag_file"
            echo "\me/ Выключен" ;;
        *)
            echo "Использование: me logo on|off" >&2
            return 1 ;;
    esac
}
